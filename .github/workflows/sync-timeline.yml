name: Sync Jira Timeline

on:
  schedule:
    - cron: '0 * * * *'   # runs hourly
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Sync from Jira
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python scripts/sync_jira_timeline.py

      - name: Commit and push if changed
        run: |
          git config user.name "jira-sync-bot"
          git config user.email "actions@github.com"
          git add index.html data.json
          if git diff --staged --quiet; then
            echo "No changes since last sync."
          else
            git commit -m "Sync timeline with Jira [automated]"
            git push
          fi
